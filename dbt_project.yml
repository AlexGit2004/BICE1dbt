
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'my_new_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths:  ["tests"]

vars:
  # ----- Umbrales de riesgo -----
  score_morosidad_alto:      40
  score_morosidad_medio:     70
  dias_atraso_umbral:        90
  fecha_corte:              '2026-09-16'

  # ----- Rango de la dimensión tiempo -----
  fecha_min_hechos:         '2020-01-01'
  fecha_max_hechos:         '2026-12-31'

  # ----- Reglas de capacidad de pago -----
  ratio_cuota_ingreso_ci:    1.5
  ratio_cuota_ingreso_nit:   3.0

  # ----- Surrogate key para clientes nuevos F6 -----
  max_cliente_id_f1:         5000

models:
  caso_estudio_bi:

    silver:
      +tags: ['silver']

      staging:
        +materialized: view
        +schema: silver
        +tags: ['silver', 'staging']

      intermediate:
        +materialized: table
        +schema: silver
        +tags: ['silver', 'intermediate']

    gold:
      +materialized: table
      +schema: gold
      +tags: ['gold']